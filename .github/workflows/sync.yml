name: Scheduled campus sync

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: none

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the web service
        run: |
          set -euo pipefail
          url="https://my-portal-pzgj.onrender.com/healthz"
          for i in 1 2 3 4 5 6; do
            if body="$(curl -fsS --retry 2 --retry-all-errors --retry-delay 5 --max-time 45 "$url")"; then
              if printf '%s' "$body" | grep -q '"ok":true'; then
                echo "healthz ok"
                exit 0
              fi
            fi
            echo "attempt $i did not succeed, waiting..."
            sleep 20
          done
          echo "healthz did not become ready"
          exit 1

      - name: Trigger sync if stale
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "SYNC_TOKEN secret is not set"
            exit 1
          fi
          code="$(curl -sS -o /tmp/sync.json -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Accept: application/json" \
            https://my-portal-pzgj.onrender.com/internal/sync)"
          echo "http ${code}"
          cat /tmp/sync.json
          echo
          test "${code}" = "200"
